name: Build

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - '**-wip'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: ubuntu-latest
    # Pull requests from the same repository won't trigger this checks as they were already triggered by the push
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'
    # The Makefile treats cspell, markdownlint and shellcheck as optional and
    # silently degrades them to no-ops when pnpm is absent, so CI must supply
    # it for `make tidy` to check anything beyond Go.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - uses: pnpm/action-setup@v6
      with:
        version: '11'
    - name: Build
      run: make
    # make runs fmt and go mod tidy, which rewrite rather than report:
    # gofmt, the whitespace pass, markdownlint --fix and go.mod churn
    # would otherwise pass silently.
    - name: Build leaves no changes
      run: git diff --exit-code
